  <script>
    // Before first paint (best effort; app.js owns the real logic): forced theme, page language, boot screen.
    (function () {
      var d = document.documentElement, s = {};
      try { s = (JSON.parse(localStorage.getItem('patra-bus:v2')) || {}).settings || {}; } catch (e) { /* ignore */ }
      if (s.theme === 'light' || s.theme === 'dark') d.dataset.theme = s.theme;
      // Same rule as resolveLang (i18n.js), so nothing is read out in the wrong language before the app has loaded (#32).
      var nl = ''; try { nl = navigator.language || (navigator.languages || [])[0] || ''; } catch (e) { /* ignore */ }
      d.lang = s.lang === 'el' || s.lang === 'en' ? s.lang : (String(nl).toLowerCase().indexOf('el') === 0 ? 'el' : 'en');
      // Boot screen (TEL-255, css/boot.css, js/boot.js): once per tab or app process, on a cold start that lands on home.
      // ?boot forces it on any hash (and leaves the key alone); ?boot=hold also keeps the last frame until a tap.
      var cities = ['patra', 'corfu'];
      var p = new URLSearchParams(location.search), force = p.has('boot'), show = force;
      var segs = location.hash.replace(/^#/, '').split('?')[0].split('/').filter(Boolean);
      if (segs.length && cities.indexOf(segs[0]) >= 0) segs.shift();
      if (!force) {
        try { show = !sessionStorage.getItem('patra-bus:boot'); sessionStorage.setItem('patra-bus:boot', '1'); } catch (e) { show = true; }
        if (segs.length) show = false;
      }
      if (!show) return;
      d.classList.add('boot');
      var B = window.__boot = { t0: performance.now(), hold: p.get('boot') === 'hold', out: false, cbs: [] };
      B.on = function (f) { if (B.out) f(); else B.cbs.push(f); };
      // Starts the exit (200 ms; 180 ms with reduced motion), then removes #boot. A tap calls it before any module has loaded.
      B.leave = function () {
        if (B.out) return;
        B.out = true;
        d.classList.add('boot-out');
        document.removeEventListener('pointerdown', tap, true);
        var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(function () {
          var el = document.getElementById('boot');
          if (el) el.remove();
          d.classList.remove('boot', 'boot-out', 'boot-hold');
        }, rm ? 180 : 200);
        B.cbs.splice(0).forEach(function (f) { try { f(); } catch (e) { /* ignore */ } });
      };
      function tap(e) { if (e.target && e.target.closest && e.target.closest('#boot')) B.leave(); }
      document.addEventListener('pointerdown', tap, true);
      // will-change only while the bus rises in
      document.addEventListener('animationend', function end(e) {
        if (e.animationName === 'boot-bus') { e.target.style.willChange = 'auto'; document.removeEventListener('animationend', end); }
      });
      if (B.hold) d.classList.add('boot-hold');
    })();
  </script>
  <script defer src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/glass.js"></script> <!-- glass UI (TEL-83, css/glass.css): the light effects and morphs -->

<body>
  <!-- Boot screen (TEL-255, variant C): shown only when the head script sets html.boot. Each moving part is its own HTML
       layer so the phone's compositor runs it while the app loads. Artwork copied from icon.svg (a rebranding changes both). -->
  <div id="boot" aria-hidden="true">
    <div class="boot-mark">
      <div class="boot-logo">
        <span class="boot-pulse"></span><span class="boot-pulse"></span><span class="boot-dot"></span>
        <span class="boot-ring"></span>
        <div class="boot-squash">
          <div class="boot-tile">
            <div class="boot-drive">
              <svg class="boot-art" viewBox="0 0 512 512" focusable="false">
                <rect x="116" y="120" width="280" height="244" rx="40" fill="#fff"/>
                <rect x="146" y="150" width="104" height="80" rx="12" fill="#0b5394"/>
                <rect x="262" y="150" width="104" height="80" rx="12" fill="#0b5394"/>
                <circle cx="164" cy="300" r="18" fill="#0b5394"/>
                <circle cx="348" cy="300" r="18" fill="#0b5394"/>
                <circle cx="178" cy="372" r="36" fill="#fff" stroke="#0b5394" stroke-width="14"/>
                <circle cx="334" cy="372" r="36" fill="#fff" stroke="#0b5394" stroke-width="14"/>
              </svg>
              <span class="boot-lamp boot-lamp-l"></span><span class="boot-lamp boot-lamp-r"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="boot-name"><span class="boot-clip"><span class="boot-word">Telematica</span></span><span class="boot-beta">BETA</span></div>
    </div>
  </div>
  <div id="app" class="app">
    <div id="map" class="map"></div>

    <!-- ☰ alone at the top left (TEL-223); the search lives in the sheet -->
    <button type="button" class="sb-btn menu-fab" id="menu-btn" aria-label="Μενού" aria-haspopup="true" aria-expanded="false" aria-controls="menu-pop"></button>
    <div class="pop" id="menu-pop" hidden></div>


    <div class="fabs-bottom" id="fabs-bottom">
      <button type="button" class="fab fab-sm" id="north-btn" aria-label="Επαναφορά βορρά" hidden></button>
      <!-- the map buttons in one glass capsule (TEL-226) -->
      <div class="map-capsule" id="map-capsule">
        <button type="button" class="fab" id="locate-btn" data-mode="idle" aria-label="Εντοπισμός τοποθεσίας"></button>
      </div>
    </div>
    <!-- the map's attribution, one line just above the sheet (map.js, attribInto; CLAUDE.md rule 5) -->
    <div class="map-attrib" id="map-attrib"></div>

    <section class="sheet" id="sheet" aria-label="Πληροφορίες" data-state="half">
      <button type="button" class="sheet-handle" id="sheet-handle"><span class="sheet-pill"></span></button>
      <div class="sheet-body" id="sheet-body" tabindex="-1">
        <!-- home only (app.js): the search at the top of the sheet, its results below it while it is open -->
        <div class="sheet-search" id="searchbar" role="search" hidden>
          <div class="sb-field">
            <input id="search-input" class="sb-input" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off"
                   autocorrect="off" spellcheck="false" placeholder="Πού πάμε;" aria-label="Αναζήτηση στάσης ή τόπου"
                   role="combobox" aria-expanded="false" aria-controls="search-list" aria-autocomplete="list">
            <span id="demo-tag" class="demo-tag" title="Δεδομένα επίδειξης" hidden>DEMO</span>
            <button type="button" class="sb-btn" id="search-clear" aria-label="Καθαρισμός αναζήτησης" hidden></button>
          </div>
          <button type="button" class="sb-btn search-close" id="search-close" aria-label="Κλείσιμο αναζήτησης"></button>
        </div>
        <div class="search-panel" id="search-panel" hidden>
          <div id="search-list" class="search-list" role="listbox" aria-label="Αποτελέσματα αναζήτησης"></div>
        </div>
        <p id="map-note" class="map-note" hidden></p>
        <!-- text-free until the first view mounts (no text in the wrong language, issue #32); app.js clears aria-busy -->
        <div class="sheet-content" id="sheet-content" aria-busy="true">
          <div class="boot-skel" aria-hidden="true"><span class="skel skel-line"></span><span class="skel skel-line"></span><span class="skel skel-line short"></span></div>
        </div>
      </div>
    </section>
  </div>
  <div id="toasts" class="toast-host" aria-live="polite" aria-atomic="true" role="status"></div>
  <noscript><p class="noscript">Απαιτείται JavaScript για να λειτουργήσει η εφαρμογή.</p></noscript>
</body>
</html>
