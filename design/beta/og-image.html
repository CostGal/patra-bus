<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Telematica beta link preview (1200x630 source)</title>
<style>
  body { margin: 0; }
  .og { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px; background: #0b5394; color: #fff;
        font-family: Inter, system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
        gap: 56px; align-items: center; }
  .left { display: flex; flex-direction: column; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .name { font-size: 48px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
  .pill { padding: 8px 18px; border-radius: 999px; background: #F9AB00; color: #0b5394; font-size: 22px; font-weight: 800; letter-spacing: .12em; }
  h1 { margin: 0; font-size: 76px; font-weight: 800; line-height: 1.04; letter-spacing: -.02em; }
  p { margin: 0; font-size: 30px; line-height: 1.3; color: #dbe7f5; }
  .foot { font-size: 22px; font-weight: 600; color: #b9cde6; letter-spacing: .01em; }
  .card { background: #fff; color: #1f1f1f; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 16px;
          box-shadow: 0 24px 60px rgba(0,0,0,.25); }
  .card-h { font-size: 22px; font-weight: 600; color: #5f6368; }
  .row { display: flex; align-items: center; gap: 20px; padding: 20px; border-radius: 18px; }
  .row.live { background: #e6f4ea; } .row.sched { background: #f1f3f4; }
  .badge { width: 64px; height: 64px; border-radius: 16px; background: #1a73e8; color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 800; }
  .eta { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .sched .eta { color: #3c4043; }
  .st { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; margin-top: 6px; }
  .live .st { color: #188038; } .sched .st { color: #5f6368; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #188038; box-shadow: 0 0 0 5px rgba(24,128,56,.2); }
  .ring { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #5f6368; }
</style>
</head>
<body>
<div class="og">
  <div class="left">
    <div class="brand"><img src="icon-beta.svg" alt=""><div class="name">Telematica</div><div class="pill">BETA</div></div>
    <h1>Έρχεται<br>στ' αλήθεια;</h1>
    <p>Ζωντανά λεωφορεία για Πάτρα και Κέρκυρα, ξεκάθαρα σημειωμένα.</p>
    <div class="foot">Κλειστή beta με πρόσκληση · Ανεπίσημη εφαρμογή</div>
  </div>
  <div class="card">
    <div class="card-h">Επόμενα λεωφορεία</div>
    <div class="row live"><div class="badge">6</div><div><div class="eta">3′</div><div class="st"><span class="dot"></span>Ζωντανά, με GPS</div></div></div>
    <div class="row sched"><div class="badge">2</div><div><div class="eta">11′</div><div class="st"><span class="ring"></span>Μόνο πρόγραμμα</div></div></div>
  </div>
</div>
</body>
</html>
