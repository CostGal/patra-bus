name: Pages

# The live site (costgal.github.io/patra-bus). TEL-211: it changes only when a GitHub Release is published with a tag
# like v0.9.1 whose commit is in main. A merge to main no longer reaches users, and a pre-release deploys nothing.
# By hand it works only from such a tag (Run workflow → "Use workflow from" → Tags): the rollback to an older release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Refuses anything that is not a release tag on main before the deploy job starts (same check as worker-deploy.yml).
  # A pre-release skips this job, and the deploy job with it.
  check:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all branches and tags, to see whether the tag's commit is in main
      - name: Only from a release tag (vX.Y.Z) that is in main
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if [ "$tag" = "$GITHUB_REF" ] || ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The site deploys only from a release tag like v0.9.1 (this run is on $GITHUB_REF)"; exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $tag points to a commit that is not in main"; exit 1
          fi
          echo "OK: $tag is a release tag on main"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp service worker cache with the commit
        run: node scripts/stamp-cache.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
