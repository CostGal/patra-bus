name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Several tests assert the Greek UI strings (the app picks its language from the system locale).
      LANG: el_GR.UTF-8
      LC_ALL: el_GR.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the secret scan below
      # Secret scan of every commit (not just the files): a key that was added and later deleted is still public.
      # Config and allowlisted test vectors: .gitleaks.toml.
      - name: Secret scan (gitleaks)
        run: |
          v=8.21.2
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --redact --no-banner
          rm gitleaks
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Chromium for the Playwright smoke tests (tests/e2e/). They mock every request off the static server.
      - run: npx playwright install --with-deps chromium
      # Unit tests (node --test) + Playwright smoke tests (360×780, both cities, recorded fixtures).
      - run: npm test
      - run: npm run check:i18n
      # The API worker bundles (syntax, imports, wrangler.toml) without deploying or logging in to Cloudflare.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker" --config worker/wrangler.toml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
